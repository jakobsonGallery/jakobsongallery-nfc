<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificat d'authenticité — Jakobson Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F1EFE8;
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-top {
      margin-bottom: 1.5rem;
      text-align: center;
      width: 100%;
    }

    .logo-top img {
      height: 150px;
      width: auto;
      max-width: 90%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 2px 18px rgba(0,0,0,0.10);
    }

    .header {
      background: #2C2C2A;
      padding: 1.7rem 1.7rem 1.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.1);
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: #D3D1C7;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .title {
      font-size: 26px;
      font-weight: 500;
      color: #F1EFE8;
      line-height: 1.3;
    }

    .artist {
      font-size: 14px;
      color: #D3D1C7;
      margin-top: 6px;
    }

    .artwork-img {
      width: 100%;
      height: 500px;
      object-fit: contain;
      background: #f5f5f5;
      display: block;
    }

    .artwork-placeholder {
      width: 100%;
      height: 420px;
      background: #D3D1C7;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #888780;
      font-size: 13px;
    }

    .body {
      padding: 1.5rem 1.7rem;
    }

    .section-label {
      font-size: 10px;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.2rem;
    }

    .field {
      background: #F1EFE8;
      border-radius: 9px;
      padding: 11px 13px;
    }

    .field-label {
      font-size: 10px;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .field-value {
      font-size: 15px;
      font-weight: 500;
      color: #2C2C2A;
      margin-top: 3px;
    }

    .description {
      font-size: 13px;
      color: #5F5E5A;
      line-height: 1.65;
      margin-bottom: 1rem;
    }

    hr {
      border: none;
      border-top: 0.5px solid #E5E3DC;
      margin: 1.2rem 0;
    }

    .cert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 12px;
    }

    .cert-id-label {
      font-size: 10px;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .cert-id-value {
      font-size: 13px;
      font-weight: 500;
      font-family: 'Courier New', monospace;
      color: #5F5E5A;
      margin-top: 2px;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #EAF3DE;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #3B6D11;
      white-space: nowrap;
    }

    .private-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #F1EFE8;
      border: 0.5px solid #D3D1C7;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      color: #888780;
      white-space: nowrap;
    }

    .footer {
      padding: 1.1rem 1.7rem;
      border-top: 0.5px solid #E5E3DC;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    .nfc-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #888780;
    }

    .loading {
      text-align: center;
      padding: 3rem 1.5rem;
      color: #888780;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #D3D1C7;
      border-top-color: #2C2C2A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 520px) {
      body { padding: 1rem 0.8rem 2rem; }
      .logo-top img { height: 105px; }
      .card { max-width: 100%; }
      .title { font-size: 22px; }
      .artwork-img { height: 430px; }
      .grid { grid-template-columns: 1fr; }
      .cert-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="logo-top">
    <img src="/logo.jpg" alt="Jakobson Gallery">
  </div>

  <div class="card" id="card">
    <div class="loading">
      <div class="spinner"></div>
      <p>Chargement du certificat…</p>
    </div>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const token = pathParts[pathParts.length - 1] || new URLSearchParams(window.location.search).get('id');

    async function loadOeuvre(t) {
      try {
        const res = await fetch('/api/oeuvre?id=' + encodeURIComponent(t));
        if (!res.ok) throw new Error();
        const d = await res.json();
        renderCert(d, t);
      } catch(e) {
        document.getElementById('card').innerHTML =
          '<div class="loading"><p style="color:#993C1D;font-weight:500">Certificat introuvable</p><p style="font-size:13px;color:#5F5E5A;margin-top:6px">Ce certificat n\\'existe pas ou a été révoqué.</p></div>';
      }
    }

    function renderCert(d, token) {
      const today = new Date().toLocaleDateString('fr-FR', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });

      const certNum = token.startsWith('JAK-') ? token : 'JAK-' + token.slice(-8).toUpperCase();

      document.getElementById('card').innerHTML = `
        <div class="header">
          <div class="badge">★ Certificat d'authenticité</div>
          <div class="title">${d.oeuvre || 'Œuvre'}</div>
          <div class="artist">par ${d.artiste || '—'}</div>
        </div>

        ${d.photo_url
          ? `<img class="artwork-img" src="${d.photo_url}" alt="${d.oeuvre || 'Œuvre'}" onerror="this.style.display='none'">`
          : '<div class="artwork-placeholder">📷 Photo à venir</div>'
        }

        <div class="body">
          <div class="section-label">Détails de l'œuvre</div>

          <div class="grid">
            <div class="field">
              <div class="field-label">Artiste</div>
              <div class="field-value">${d.artiste || '—'}</div>
            </div>

            <div class="field">
              <div class="field-label">Année</div>
              <div class="field-value">${d.annee || '—'}</div>
            </div>

            <div class="field">
              <div class="field-label">Technique</div>
              <div class="field-value">${d.technique || '—'}</div>
            </div>

            <div class="field">
              <div class="field-label">Dimensions</div>
              <div class="field-value">${d.dimensions || '—'}</div>
            </div>
          </div>

          ${d.notes ? `<p class="description">${d.notes}</p>` : ''}

          <hr>

          <div class="cert-row">
            <div>
              <div class="cert-id-label">N° de certificat</div>
              <div class="cert-id-value">${certNum}</div>
            </div>
            <div class="verified">✓ Authentifié</div>
          </div>

          <div class="cert-row">
            <div>
              <div class="cert-id-label">Date de vérification</div>
              <div class="cert-id-value">${today}</div>
            </div>
            <div class="private-badge">🔒 Propriétaire confidentiel</div>
          </div>
        </div>

        <div class="footer">
          <img src="/logo.jpg" alt="Jakobson Gallery" class="footer-logo">
          <div class="nfc-label">📡 Vérifié par NFC</div>
        </div>`;
    }

    if (token && token !== 'oeuvre') {
      loadOeuvre(token);
    } else {
      document.getElementById('card').innerHTML =
        '<div class="loading"><p style="font-weight:500;color:#2C2C2A">Jakobson Gallery</p><p style="font-size:13px;color:#5F5E5A;margin-top:6px">Scannez un tag NFC pour afficher le certificat.</p></div>';
    }
  </script>
</body>
</html>
