<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificat d'authenticité — Jakobson Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F1EFE8;
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-top { margin-bottom: 1.25rem; text-align: center; }
    .logo-top img { height: 48px; width: auto; object-fit: contain; }
    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .header {
      background: #2C2C2A;
      padding: 1.5rem 1.5rem 1.25rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .header-text { flex: 1; }
    .header-logo { height: 36px; width: auto; object-fit: contain; opacity: 0.9; flex-shrink: 0; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.1);
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: #D3D1C7;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .title { font-size: 20px; font-weight: 500; color: #F1EFE8; line-height: 1.3; }
    .artist { font-size: 13px; color: #888780; margin-top: 4px; }
    .artwork-img { width: 100%; height: 240px; object-fit: cover; display: block; }
    .artwork-placeholder {
      width: 100%;
      height: 240px;
      background: #D3D1C7;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #888780;
      font-size: 13px;
    }
    .body { padding: 1.25rem 1.5rem; }
    .section-label {
      font-size: 10px;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      margin-top: 1rem;
    }
    .section-label:first-child { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 0.5rem;
    }
    .field {
      background: #F1EFE8;
      border-radius: 8px;
      padding: 9px 11px;
    }
    .field-label {
      font-size: 10px;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .field-value {
      font-size: 14px;
      font-weight: 500;
      color: #2C2C2A;
      margin-top: 2px;
      word-break: break-word;
    }
    .description {
      font-size: 13px;
      color: #5F5E5A;
      line-height: 1.65;
      margin: 1rem 0;
    }
    hr { border: none; border-top: 0.5px solid #E5E3DC; margin: 1rem 0; }
    .cert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 10px;
    }
    .cert-id-label {
      font-size: 10px;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .cert-id-value {
      font-size: 13px;
      font-weight: 500;
      font-family: 'Courier New', monospace;
      color: #5F5E5A;
      margin-top: 2px;
    }
    .verified {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #EAF3DE;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #3B6D11;
      white-space: nowrap;
    }
    .footer {
      padding: 1rem 1.5rem;
      border-top: 0.5px solid #E5E3DC;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-logo { height: 28px; width: auto; object-fit: contain; }
    .nfc-label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888780; }
    .loading { text-align: center; padding: 3rem 1.5rem; color: #888780; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #D3D1C7;
      border-top-color: #2C2C2A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notice {
      background: #F1EFE8;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      color: #5F5E5A;
      line-height: 1.5;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="logo-top">
    <img src="/logo.jpg" alt="Jakobson Gallery">
  </div>

  <div class="card" id="card">
    <div class="loading">
      <div class="spinner"></div>
      <p>Chargement du certificat…</p>
    </div>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const token = pathParts[pathParts.length - 1] || new URLSearchParams(window.location.search).get('token');

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    async function loadCertificate(tokenValue) {
      try {
        const res = await fetch('/api/oeuvre?token=' + encodeURIComponent(tokenValue));
        if (!res.ok) throw new Error('Certificat introuvable');

        const data = await res.json();
        renderCert(data);
      } catch(e) {
        document.getElementById('card').innerHTML = `
          <div class="loading">
            <p style="color:#993C1D;font-weight:500">Certificat introuvable ou désactivé</p>
            <p style="font-size:13px;color:#5F5E5A;margin-top:6px">
              Ce certificat n'existe pas, a été désactivé, ou doit être vérifié par la galerie.
            </p>
          </div>`;
      }
    }

    function renderCert(data) {
      const c = data.certificat || {};
      const o = data.oeuvre || {};
      const today = new Date().toLocaleDateString('fr-FR', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });

      document.getElementById('card').innerHTML = `
        <div class="header">
          <div class="header-text">
            <div class="badge">★ Certificat d'authenticité</div>
            <div class="title">${escapeHTML(o.titre || 'Œuvre')}</div>
            <div class="artist">par ${escapeHTML(o.artiste || '—')}</div>
          </div>
          <img src="/logo.jpg" alt="Jakobson Gallery" class="header-logo">
        </div>

        ${o.photo_url
          ? `<img class="artwork-img" src="${escapeHTML(o.photo_url)}" alt="${escapeHTML(o.titre || 'Œuvre')}" onerror="this.style.display='none'">`
          : '<div class="artwork-placeholder">📷 Photo à venir</div>'
        }

        <div class="body">
          <div class="section-label">Détails de l'œuvre</div>
          <div class="grid">
            <div class="field">
              <div class="field-label">Artiste</div>
              <div class="field-value">${escapeHTML(o.artiste || '—')}</div>
            </div>
            <div class="field">
              <div class="field-label">Année</div>
              <div class="field-value">${escapeHTML(o.annee || '—')}</div>
            </div>
            <div class="field">
              <div class="field-label">Technique</div>
              <div class="field-value">${escapeHTML(o.technique || '—')}</div>
            </div>
            <div class="field">
              <div class="field-label">Dimensions</div>
              <div class="field-value">${escapeHTML(o.dimensions || '—')}</div>
            </div>
          </div>

          ${o.notes ? `<p class="description">${escapeHTML(o.notes)}</p>` : ''}

          <hr>

          <div class="cert-row">
            <div>
              <div class="cert-id-label">N° de certificat</div>
              <div class="cert-id-value">${escapeHTML(c.numero || '—')}</div>
            </div>
            <div class="verified">✓ ${escapeHTML(c.statut || 'Authentifié')}</div>
          </div>

          <div class="cert-row">
            <div>
              <div class="cert-id-label">Date de consultation</div>
              <div class="cert-id-value">${today}</div>
            </div>
            <div>
              <div class="cert-id-label">Galerie</div>
              <div class="cert-id-value">${escapeHTML(c.galerie || 'Jakobson Gallery')}</div>
            </div>
          </div>

          <div class="notice">
            Ce certificat numérique confirme les informations publiques de l'œuvre enregistrées par la galerie.
            Les informations privées d'achat et d'acquéreur ne sont pas affichées.
          </div>
        </div>

        <div class="footer">
          <img src="/logo.jpg" alt="Jakobson Gallery" class="footer-logo">
          <div class="nfc-label">📡 Vérifié par NFC</div>
        </div>`;
    }

    if (token && token.length >= 12) {
      loadCertificate(token);
    } else {
      document.getElementById('card').innerHTML = `
        <div class="loading">
          <p style="font-weight:500;color:#2C2C2A">Jakobson Gallery</p>
          <p style="font-size:13px;color:#5F5E5A;margin-top:6px">
            Scannez un tag NFC pour afficher le certificat.
          </p>
        </div>`;
    }
  </script>
</body>
</html>
