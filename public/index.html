<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificat d'authenticité — Jakobson Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#F1EFE8;
  min-height:100vh;
  padding:24px 16px 48px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.logo-top{text-align:center;margin-bottom:24px}
.logo-top img{height:130px;width:auto;max-width:90%;object-fit:contain}
.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  max-width:650px;
  width:100%;
  box-shadow:0 2px 18px rgba(0,0,0,.10);
}
.header{background:#2C2C2A;padding:28px}
.badge{
  display:inline-flex;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:4px 12px;
  font-size:11px;
  color:#D3D1C7;
  letter-spacing:.07em;
  text-transform:uppercase;
  margin-bottom:14px;
}
.title{font-size:26px;font-weight:500;color:#F1EFE8}
.artist{font-size:14px;color:#D3D1C7;margin-top:6px}
.artwork-img{
  width:100%;
  height:500px;
  object-fit:contain;
  background:#f5f5f5;
  display:block;
}
.artwork-placeholder{
  height:360px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  color:#777;
}
.body{padding:26px 28px}
.section-label{
  font-size:10px;
  color:#888780;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:10px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}
.field{
  background:#F1EFE8;
  border-radius:9px;
  padding:12px 14px;
}
.field-label{
  font-size:10px;
  color:#888780;
  text-transform:uppercase;
  letter-spacing:.06em;
}
.field-value{
  font-size:15px;
  font-weight:500;
  color:#2C2C2A;
  margin-top:4px;
}
.description{
  font-size:13px;
  color:#5F5E5A;
  line-height:1.6;
  margin-bottom:16px;
}
hr{border:none;border-top:1px solid #E5E3DC;margin:18px 0}
.cert-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:12px;
}
.cert-id-label{
  font-size:10px;
  color:#888780;
  text-transform:uppercase;
  letter-spacing:.06em;
}
.cert-id-value{
  font-size:13px;
  font-family:'Courier New',monospace;
  color:#5F5E5A;
  margin-top:3px;
}
.verified{
  background:#EAF3DE;
  color:#3B6D11;
  border-radius:20px;
  padding:6px 13px;
  font-size:12px;
  font-weight:500;
}
.private-badge{
  background:#F1EFE8;
  border:1px solid #D3D1C7;
  border-radius:20px;
  padding:5px 11px;
  font-size:11px;
  color:#888780;
}
.footer{
  padding:18px 28px;
  border-top:1px solid #E5E3DC;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.footer-logo{height:42px;width:auto}
.nfc-label{font-size:11px;color:#888780}
.loading{text-align:center;padding:48px 24px;color:#888780}
.spinner{
  width:32px;
  height:32px;
  border:2px solid #D3D1C7;
  border-top-color:#2C2C2A;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:520px){
  .logo-top img{height:100px}
  .artwork-img{height:420px}
  .grid{grid-template-columns:1fr}
  .cert-row{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<div class="logo-top">
  <img src="/logo.jpg" alt="Jakobson Gallery">
</div>

<div class="card" id="card">
  <div class="loading">
    <div class="spinner"></div>
    <p>Chargement du certificat...</p>
  </div>
</div>

<script>
const pathParts = window.location.pathname.split('/').filter(Boolean);
const token = pathParts[pathParts.length - 1] || new URLSearchParams(window.location.search).get('id');

async function loadOeuvre(t) {
  try {
    const res = await fetch('/api/oeuvre?id=' + encodeURIComponent(t));
    if (!res.ok) throw new Error('API error');
    const d = await res.json();
    renderCert(d, t);
  } catch (e) {
    document.getElementById('card').innerHTML =
      '<div class="loading"><p style="color:#993C1D;font-weight:500">Certificat introuvable</p><p style="font-size:13px;color:#5F5E5A;margin-top:6px">Ce certificat n’existe pas ou a été révoqué.</p></div>';
  }
}

function renderCert(d, token) {
  const today = new Date().toLocaleDateString('fr-FR', {
    day:'numeric',
    month:'long',
    year:'numeric'
  });

  const certNum = token.startsWith('JAK-') ? token : 'JAK-' + token.slice(-8).toUpperCase();

  document.getElementById('card').innerHTML = `
    <div class="header">
      <div class="badge">★ Certificat d'authenticité</div>
      <div class="title">${d.oeuvre || 'Œuvre'}</div>
      <div class="artist">par ${d.artiste || '—'}</div>
    </div>

    ${
      d.photo_url
      ? `<img class="artwork-img" src="${d.photo_url}" alt="${d.oeuvre || 'Œuvre'}">`
      : `<div class="artwork-placeholder">Photo à venir</div>`
    }

    <div class="body">
      <div class="section-label">Détails de l'œuvre</div>

      <div class="grid">
        <div class="field"><div class="field-label">Artiste</div><div class="field-value">${d.artiste || '—'}</div></div>
        <div class="field"><div class="field-label">Année</div><div class="field-value">${d.annee || '—'}</div></div>
        <div class="field"><div class="field-label">Technique</div><div class="field-value">${d.technique || '—'}</div></div>
        <div class="field"><div class="field-label">Dimensions</div><div class="field-value">${d.dimensions || '—'}</div></div>
      </div>

      ${d.notes ? `<p class="description">${d.notes}</p>` : ''}

      <hr>

      <div class="cert-row">
        <div>
          <div class="cert-id-label">N° de certificat</div>
          <div class="cert-id-value">${certNum}</div>
        </div>
        <div class="verified">✓ Authentifié</div>
      </div>

      <div class="cert-row">
        <div>
          <div class="cert-id-label">Date de vérification</div>
          <div class="cert-id-value">${today}</div>
        </div>
        <div class="private-badge">🔒 Propriétaire confidentiel</div>
      </div>
    </div>

    <div class="footer">
      <img src="/logo.jpg" class="footer-logo" alt="Jakobson Gallery">
      <div class="nfc-label">📡 Vérifié par NFC</div>
    </div>
  `;
}

if (token && token !== 'oeuvre') {
  loadOeuvre(token);
} else {
  document.getElementById('card').innerHTML =
    '<div class="loading"><p style="font-weight:500;color:#2C2C2A">Jakobson Gallery</p><p style="font-size:13px;color:#5F5E5A;margin-top:6px">Scannez un tag NFC pour afficher le certificat.</p></div>';
}
</script>

</body>
</html>
